<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><title>K02</title>
<style>
.flow { display: flex; align-items: stretch; gap: 16px; margin-top: 10px; } .arrow { align-self: center; }
.step { flex: 1; text-align: center; padding: 40px 12px 30px; border-radius: 26px; border: 3px solid var(--line); background: #fff; }
.step .n { width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 36px; }
.step .t { font-size: 40px; font-weight: 750; white-space: nowrap; }
.step .s { font-size: 26px; line-height: 1.25; min-height: 66px; color: var(--muted); margin-top: 8px; }
.arrow { font-size: 54px; color: #9ca3af; font-weight: 700; }
</style></head><body>
<div class="wrap">
  <div class="eyebrow in d1">How it works</div>
  <h1 class="in d1">Every invoice, the same six steps</h1>
  <div class="flow">
    <div class="step in d2"><div class="n green">1</div><div class="t">Read</div><div class="s">AI reads every field</div></div><div class="arrow in d2">›</div>
    <div class="step in d3"><div class="n green">2</div><div class="t">Check</div><div class="s">code checks the maths</div></div><div class="arrow in d3">›</div>
    <div class="step in d4"><div class="n red">3</div><div class="t">De-duplicate</div><div class="s">repeats are blocked</div></div><div class="arrow in d4">›</div>
    <div class="step in d5"><div class="n amber">4</div><div class="t">Route</div><div class="s">rules pick who</div></div><div class="arrow in d5">›</div>
    <div class="step in d6"><div class="n amber">5</div><div class="t">Approve</div><div class="s">with a reason</div></div><div class="arrow in d6">›</div>
    <div class="step in d7"><div class="n green">6</div><div class="t">Post</div><div class="s">to accounting</div></div>
  </div>
</div>
</body></html>
