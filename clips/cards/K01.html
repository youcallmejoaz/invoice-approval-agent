<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><title>K01</title>
<style>
.art { position: absolute; right: 170px; top: 230px; width: 560px; height: 640px; }
.paper { position: absolute; width: 430px; height: 560px; background: #fff; border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 24px 60px rgba(17,24,39,.12); padding: 44px 40px; }
.paper.a { left: 0; top: 0; transform: rotate(-5deg); }
.paper.b { left: 120px; top: 70px; transform: rotate(4deg); }
.ph { height: 26px; width: 58%; background: #111827; border-radius: 8px; margin-bottom: 34px; }
.pl { height: 16px; background: #e5e7eb; border-radius: 8px; margin: 18px 0; }
.pt { height: 26px; width: 40%; margin-left: auto; margin-top: 44px; background: #9ca3af; border-radius: 8px; }
.stamp { position: absolute; left: 150px; top: 290px; transform: rotate(-14deg); border: 8px solid var(--red); color: var(--red); font-weight: 800; font-size: 62px; padding: 8px 26px; border-radius: 14px; letter-spacing: .04em; background: rgba(255,255,255,.85); }
.stamp.in { animation-name: stampIn; }
@keyframes stampIn { from { opacity: 0; transform: rotate(-14deg) scale(1.6); } to { opacity: 1; transform: rotate(-14deg) scale(1); } }
</style></head><body>
<div class="wrap">
  <div class="eyebrow in d1">The problem</div>
  <div class="row in d2"><div class="badge amber">1</div>Invoices typed in by hand.</div>
  <div class="row in d3"><div class="badge red">2</div>Duplicates paid twice.</div>
  <div class="row in d4"><div class="badge red">3</div>Approvals lost in email.</div>
</div>
<div class="art">
  <div class="paper a in d2"><div class="ph"></div><div class="pl"></div><div class="pl" style="width:80%"></div><div class="pl"></div><div class="pl" style="width:65%"></div><div class="pt"></div></div>
  <div class="paper b in d3"><div class="ph"></div><div class="pl"></div><div class="pl" style="width:80%"></div><div class="pl"></div><div class="pl" style="width:65%"></div><div class="pt"></div></div>
  <div class="stamp in d4">PAID TWICE</div>
</div>
</body></html>
